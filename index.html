    <script>
      // HMR: Disabled in AI Studio iframe. Suppress Vite client WebSocket disconnection noise.
      window.addEventListener('unhandledrejection', function(event) {
        var msg = (event && event.reason && (event.reason.message || event.reason.stack || '')) + '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('@vite/client') !== -1) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('error', function(event) {
        var msg = (event && (event.message || '')) + '';
        var src = (event && (event.filename || '')) + '';
        if (msg.indexOf('WebSocket') !== -1 || src.indexOf('@vite/client') !== -1) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
